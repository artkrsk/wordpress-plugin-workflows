# .github/workflows/test.yml in a plugin repo — thin caller of the reusable CI.
name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Supersede in-flight runs for the same ref so pushes don't pile up on the
# single self-hosted runner.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    uses: artkrsk/wordpress-plugin-workflows/.github/workflows/test.yml@main
    with:
      zip_budget_mb: '0.25'
      coverage: true
      blueprint_check: true
      # integration_suites: '["", "phpunit-no-elementor.xml.dist"]'
      # wp_env_ports: '8892,8893'
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
