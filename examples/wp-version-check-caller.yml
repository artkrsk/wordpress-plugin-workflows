# .github/workflows/wp-version-checker.yml in a plugin repository: opens an
# issue when "Tested up to" falls behind WordPress, closes it once it catches up.
name: WordPress version check

on:
  schedule:
    - cron: '0 6 * * 1-5'
  workflow_dispatch:
    inputs:
      channel:
        description: Which WordPress versions count
        type: choice
        options: [rc, stable, beta]
        default: rc

jobs:
  wp-version-check:
    uses: artkrsk/wordpress-plugin-workflows/.github/workflows/wp-version-check.yml@main
    # The check reads the readme and opens, updates and closes its own issue
    permissions:
      contents: read
      issues: write
    with:
      channel: ${{ inputs.channel || 'rc' }}
