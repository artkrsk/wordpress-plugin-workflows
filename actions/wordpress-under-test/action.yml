name: WordPress under test
description: >
  Points the job's wp-env at the newest build of the WordPress version the
  plugin declares as "Tested up to" (composer.json, the `wordpress` block)
  through `.wp-env.override.json`, so CI tests what the plugin claims: a
  release candidate from the day the value is raised to it, the latest patch
  release after that. Run it from the repository root before wp-env starts.

outputs:
  version:
    description: The WordPress build the job runs on, e.g. 7.2-RC2 (empty when composer.json declares no "Tested up to")
    value: ${{ steps.resolve.outputs.version }}

runs:
  using: composite
  steps:
    - name: Resolve the WordPress version under test
      id: resolve
      shell: bash
      run: bash "${{ github.action_path }}/wordpress-under-test.sh" >> "$GITHUB_OUTPUT"
