name: WordPress under test
description: >
  For a pull request that changes the plugin's "Tested up to" (composer.json,
  the `wordpress` block): points the job's wp-env at the newest build of the
  declared WordPress version through `.wp-env.override.json`, so the pull
  request that makes the claim is the one that proves it. Run it from the
  repository root before wp-env starts. Any other event or pull request
  writes nothing and leaves `version` empty.

inputs:
  token:
    description: Token that may read the repository
    required: false
    default: ${{ github.token }}

outputs:
  version:
    description: The WordPress build the job runs on, e.g. 7.2-RC2 (empty when "Tested up to" did not change)
    value: ${{ steps.resolve.outputs.version }}

runs:
  using: composite
  steps:
    - name: Resolve the WordPress version under test
      id: resolve
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: bash "${{ github.action_path }}/wordpress-under-test.sh" >> "$GITHUB_OUTPUT"
