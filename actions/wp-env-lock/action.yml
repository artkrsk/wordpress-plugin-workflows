name: wp-env host lock
description: >
  Serializes wp-env/Docker lifecycles across every repo on a shared self-hosted
  runner host. GitHub's `concurrency:` key only serializes within one repository —
  on a host running one runner service per repo, another repo's wp-env can still
  collide on fixed ports or starve the host's RAM. A flock on a host-wide path
  closes that gap for every repo that uses this action.

inputs:
  mode:
    description: acquire | release
    required: true
  ports:
    description: >
      Comma-separated host ports whose stale containers get removed on acquire
      (e.g. "8890,8891"). Plugin-check always binds 8880/8881 — include them
      when the job runs the plugin-check action.
    required: false
    default: ''
  project:
    description: wp-env project name filter for stale-container cleanup (usually the plugin slug)
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Acquire host-wide wp-env lock
      if: inputs.mode == 'acquire'
      shell: bash
      run: bash "${{ github.action_path }}/wp-env-host-lock.sh" acquire

    - name: Clean up stale wp-env Docker resources
      if: inputs.mode == 'acquire' && (inputs.ports != '' || inputs.project != '')
      shell: bash
      run: |
        # A container leaked by a cancelled run pins the previous dist/ inode
        # through its bind mount and keeps its ports bound. Remove by project
        # name and by published port; the name filter also catches instances
        # orphaned under a stale wp-env hash.
        if [ -n "${{ inputs.project }}" ]; then
          docker rm -f $(docker ps -aq --filter "name=wp-env-${{ inputs.project }}") 2>/dev/null || true
        fi
        IFS=',' read -ra PORTS <<< "${{ inputs.ports }}"
        for port in "${PORTS[@]}"; do
          docker rm -f $(docker ps -aq --filter "publish=${port}") 2>/dev/null || true
        done
        # `|| true` only catches a non-zero exit, not a hang; wp-env destroy can
        # wedge on Docker I/O, so bound it (TERM at 180s, KILL 30s later).
        timeout --kill-after=30 180 npx wp-env destroy --force 2>/dev/null || true
        # Hashed wp-env dirs are populated via Docker (root-owned); a stale file
        # causes EACCES on re-setup and a plain rm can't remove it. Delete from
        # inside a container as root.
        if [ -n "${{ inputs.project }}" ]; then
          docker run --rm -v "$HOME/.wp-env:/wp-env" alpine \
            sh -c 'rm -rf /wp-env/wp-env-${{ inputs.project }}-*' 2>/dev/null || true
        fi

    - name: Release host-wide wp-env lock
      if: inputs.mode == 'release'
      shell: bash
      run: bash "${{ github.action_path }}/wp-env-host-lock.sh" release
