name: Plugin Tests

# Reusable CI for Arts WordPress plugins (pnpm + @arts/wp-plugin-tooling repos).
# Callers provide triggers + concurrency and pass the per-repo knobs as inputs.

on:
  workflow_call:
    inputs:
      runner:
        description: Runner label for the heavy jobs
        required: false
        type: string
        default: self-hosted
      zip_budget_mb:
        description: Hard ceiling for the release zip, in MB (e.g. "0.25")
        required: true
        type: string
      build_docs:
        description: >
          Build the VitePress docs in the quality job. deploy-docs only fires on
          a push to the default branch, so without this a broken docs config
          isn't discovered until after merge.
        required: false
        type: boolean
        default: false
      run_js_tests:
        description: Run the Vitest suite in the quality job
        required: false
        type: boolean
        default: true
      coverage:
        description: Upload Vitest coverage to Codecov (informational only, never a gate)
        required: false
        type: boolean
        default: false
      blueprint_check:
        description: Assert the wp.org Live Preview blueprint is regenerated and committed
        required: false
        type: boolean
        default: false
      blueprint_check_command:
        description: >
          Command for the blueprint check. Repos on the shared arts-wp blueprint
          module keep the default; repos with custom blueprint builders
          (repeater-tags) pass their own scripts + staleness assert.
        required: false
        type: string
        default: pnpm exec arts-wp blueprint check
      integration_suites:
        description: >
          JSON array of PHPUnit config files to run inside wp-env against the
          built dist/ artifact ("" entry = default phpunit.xml.dist).
          Empty array = no integration job.
        required: false
        type: string
        default: '[]'
      wp_env_ports:
        description: The repo's committed wp-env ports, comma-separated (e.g. "8890,8891")
        required: false
        type: string
        default: ''
      integration_command:
        description: >
          Replaces the built-in per-suite PHPUnit loop. For repos whose suites
          don't run as `--env-cwd=test-workspace -- vendor/bin/phpunit` — e.g.
          fluid-design-system, whose integration tier uses an isolated PHPUnit
          install to keep two Composer autoloaders from colliding.
        required: false
        type: string
        default: ''
      integration_setup_command:
        description: >
          Runs inside wp-env's lifetime, after start and before any suite.
          For preparing test-only tooling that has to exist in the container.
        required: false
        type: string
        default: ''
      run_e2e:
        description: Run a Playwright suite against the same wp-env instance
        required: false
        type: boolean
        default: false
      e2e_command:
        description: The Playwright invocation
        required: false
        type: string
        default: pnpm exec playwright test --project=chromium
      playwright_browsers:
        description: Space-separated browsers to install (e.g. "chromium firefox webkit")
        required: false
        type: string
        default: chromium
      extra_plugin_check_ignore_codes:
        description: Extra plugin-check codes to ignore (newline-separated), appended to the shared set
        required: false
        type: string
        default: ''
    secrets:
      CODECOV_TOKEN:
        description: Codecov upload token (only needed when coverage input is true)
        required: false

permissions:
  contents: read

env:
  NODE_OPTIONS: '--dns-result-order=ipv4first --no-network-family-autoselection'
  SLUG: ''

jobs:
  quality:
    name: Code Quality
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Disable git hooks
        run: git config --global core.hooksPath /dev/null

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        if: runner.environment == 'github-hosted'
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Setup pnpm
        if: runner.environment == 'github-hosted'
        run: corepack enable

      - name: Setup PHP
        if: runner.environment == 'github-hosted'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Composer dependencies (runs Strauss via post-install hook)
        run: composer install --prefer-dist --no-progress

      - name: Biome
        run: pnpm exec biome ci .

      - name: Stylelint
        run: |
          if [ -d src/styles ]; then
            pnpm exec stylelint 'src/styles/**/*.scss'
          else
            echo "No src/styles — skipped"
          fi

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Vitest
        if: inputs.run_js_tests && !inputs.coverage
        run: pnpm exec vitest run

      - name: Vitest + coverage
        if: inputs.run_js_tests && inputs.coverage
        run: pnpm exec vitest run --coverage

      - name: Upload coverage to Codecov
        if: inputs.run_js_tests && inputs.coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/coverage-final.json
          fail_ci_if_error: false

      - name: PHPStan
        run: |
          if [ -f phpstan.neon ]; then
            vendor/bin/phpstan analyse --memory-limit=1G --no-progress
          else
            echo "No phpstan.neon — skipped"
          fi

      - name: PHPCS
        run: |
          if [ -f phpcs.xml ]; then
            vendor/bin/phpcs
          else
            echo "No phpcs.xml — skipped"
          fi

      - name: Build docs
        if: inputs.build_docs
        run: pnpm exec vitepress build docs

      - name: Knip
        run: pnpm exec knip

      - name: Fallow (advisory)
        continue-on-error: true
        run: pnpm exec fallow

      - name: Composer audit
        # Per-CVE documented ignores live in composer.json (config.audit.ignore) —
        # never blanket-suppressed here. --ignore-unreachable: a Packagist
        # advisory-API outage (502s happen) must not fail CI; real advisories
        # still do.
        run: composer audit --locked --ignore-unreachable

      - name: Changelog grammar
        run: pnpm exec arts-wp changelog validate --latest

      - name: Blueprint is valid and regenerated
        if: inputs.blueprint_check
        run: ${{ inputs.blueprint_check_command }}

  plugin-check:
    name: WordPress.org Plugin Check
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Disable git hooks
        run: git config --global core.hooksPath /dev/null

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        if: runner.environment == 'github-hosted'
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Setup pnpm
        if: runner.environment == 'github-hosted'
        run: corepack enable

      - name: Setup PHP
        if: runner.environment == 'github-hosted'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Composer dependencies (runs Strauss via post-install hook)
        run: composer install --prefer-dist --no-progress

      - name: Build plugin
        run: pnpm build

      - name: Validate ZIP size
        run: |
          SLUG=$(node -e "import('./project.config.js').then(m => console.log(m.default.slug))")
          ZIP_FILE="dist/${SLUG}.zip"
          SIZE_BYTES=$(stat -f%z "$ZIP_FILE" 2>/dev/null || stat -c%s "$ZIP_FILE")
          SIZE_MB=$(echo "scale=2; $SIZE_BYTES / 1024 / 1024" | bc)

          if (( $(echo "$SIZE_MB > ${{ inputs.zip_budget_mb }}" | bc -l) )); then
            echo "ZIP too large: ${SIZE_MB} MB (max ${{ inputs.zip_budget_mb }} MB)"
            exit 1
          fi

          echo "ZIP size: ${SIZE_MB} MB"
          echo "SLUG=$SLUG" >> "$GITHUB_ENV"

      - name: Acquire cross-repo wp-env lock
        uses: artkrsk/wordpress-plugin-workflows/actions/wp-env-lock@main
        with:
          mode: acquire
          # plugin-check-action always binds 8880/8881
          ports: '8880,8881'
          project: ${{ env.SLUG }}

      - name: Run WordPress Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: ./dist/${{ env.SLUG }}
          wp-version: 'latest'
          # The plugins' prefixes are deliberate and consistent but don't derive
          # from the slug, which is all this sniff accepts.
          ignore-codes: |
            WordPress.NamingConventions.PrefixAllGlobals.InvalidPrefixPassed
            ${{ inputs.extra_plugin_check_ignore_codes }}

      - name: Release cross-repo wp-env lock
        if: always()
        uses: artkrsk/wordpress-plugin-workflows/actions/wp-env-lock@main
        with:
          mode: release

  integration:
    name: Integration Tests
    # Any of the three can carry the job: the suite loop, a repo-specific
    # command that replaces it, or an e2e run. They share one wp-env on
    # purpose — the runner host is the scarce resource, and starting it twice
    # would double the slowest job in the pipeline.
    if: inputs.integration_suites != '[]' || inputs.integration_command != '' || inputs.run_e2e
    runs-on: ${{ inputs.runner }}
    # First run on a fresh runner downloads WP + plugin zips, builds arm64
    # images, and sparse-clones the core PHPUnit suite.
    timeout-minutes: 30
    steps:
      - name: Disable git hooks
        run: git config --global core.hooksPath /dev/null

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        if: runner.environment == 'github-hosted'
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Setup pnpm
        if: runner.environment == 'github-hosted'
        run: corepack enable

      - name: Setup PHP
        if: runner.environment == 'github-hosted'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Composer dependencies (runs Strauss via post-install hook)
        run: composer install --prefer-dist --no-progress

      - name: Resolve slug
        run: |
          SLUG=$(node -e "import('./project.config.js').then(m => console.log(m.default.slug))")
          echo "SLUG=$SLUG" >> "$GITHUB_ENV"

      - name: Acquire cross-repo wp-env lock
        uses: artkrsk/wordpress-plugin-workflows/actions/wp-env-lock@main
        with:
          mode: acquire
          ports: ${{ inputs.wp_env_ports }}
          project: ${{ env.SLUG }}

      - name: Build plugin
        run: pnpm build

      - name: Install Playwright browsers
        if: inputs.run_e2e
        run: pnpm exec playwright install ${{ inputs.playwright_browsers }}

      - name: Install Playwright system dependencies
        if: inputs.run_e2e && runner.environment == 'github-hosted'
        run: pnpm exec playwright install-deps ${{ inputs.playwright_browsers }}

      - name: Start wp-env
        run: pnpm exec wp-env start

      - name: Integration setup
        if: inputs.integration_setup_command != ''
        run: ${{ inputs.integration_setup_command }}

      - name: PHPUnit suites
        if: inputs.integration_suites != '[]' && inputs.integration_command == ''
        run: |
          echo '${{ inputs.integration_suites }}' | node -e '
            const suites = JSON.parse(require("fs").readFileSync(0, "utf8"))
            const { execSync } = require("child_process")
            for (const cfg of suites) {
              const flag = cfg ? ` -c ${cfg}` : ""
              console.log(`\n=== PHPUnit${flag || " (default)"} ===`)
              execSync(
                `pnpm exec wp-env run tests-cli --env-cwd=test-workspace -- vendor/bin/phpunit${flag}`,
                { stdio: "inherit" }
              )
            }
          '

      - name: PHPUnit suites (repo command)
        if: inputs.integration_command != ''
        run: ${{ inputs.integration_command }}

      - name: E2E suite
        if: inputs.run_e2e
        run: ${{ inputs.e2e_command }}

      - name: Dump environment diagnostics
        if: failure()
        run: |
          docker ps -a || true
          pnpm exec wp-env run cli -- tail -n 100 /var/www/html/wp-content/debug.log || true

      - name: Destroy wp-env
        if: always()
        run: timeout --kill-after=30 180 pnpm exec wp-env destroy --force 2>/dev/null || true

      - name: Upload Playwright report
        if: always() && inputs.run_e2e
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload Playwright traces and video
        if: failure() && inputs.run_e2e
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

      - name: Release cross-repo wp-env lock
        if: always()
        uses: artkrsk/wordpress-plugin-workflows/actions/wp-env-lock@main
        with:
          mode: release
