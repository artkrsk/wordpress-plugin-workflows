name: Cut Release

# Second half of the release-PR pipeline (the first is prepare-release.yml): when a
# `release/x.y.z` PR from this repository is merged, verify the merge commit and tag it
# `vX.Y.Z`. The tag is created with a GitHub App token, so the push event starts the
# caller's tag-triggered release.yml (GitHub Release + wp.org SVN) natively. Events from
# GITHUB_TOKEN would not start it.
#
# The caller owns the triggers:
#   on: pull_request: { types: [closed], branches: [main] }   (automatic, on merge)
#   on: workflow_dispatch: { inputs: pr_number, dry_run }      (manual, for a merged release PR)
# and should gate its job on merged + head ref `release/*` + same-repo head for the PR event.
# This workflow re-checks all of that: it is the only thing that can start a wp.org deploy.
# The manual path exists for recovery: a release PR merged before this workflow was installed,
# or an event that never arrived, can be tagged on demand with the same verification.
#
# dry_run (default TRUE here) verifies everything and reports what it would tag, creating
# nothing. A pull_request trigger has no inputs, so the caller decides: pass
# `dry_run: ${{ inputs.dry_run == true }}` to be live on merge and dry by default on manual runs.
#
# Two more refusals before a tag is ever created, because tagging is the only thing standing
# between a merge and a wp.org deploy:
#   - CI gate: every check run on the PR's head commit must have completed green. The required-
#     status-checks ruleset normally guarantees this, but its bypass actors (repo admins) can
#     merge around it, so this is the backstop for that case, not a duplicate of it.
#   - Staleness gate: if anything under shipped_paths landed on the default branch between the
#     PR's head commit and its merge commit (another PR merged first, or a direct push), the
#     merge commit ships changes the release PR's changelog never saw. Refuses rather than
#     tagging silently; re-run prepare-release to fold the missed changes into a new release PR.

on:
  workflow_call:
    inputs:
      client_id:
        description: Client ID of the release GitHub App (not needed for dry_run)
        required: false
        type: string
        default: ''
      dry_run:
        description: Verify and report only; create no tag
        required: false
        type: boolean
        default: true
      runner:
        description: Runner label
        required: false
        type: string
        default: ubuntu-latest
      pr_number:
        description: Merged release PR to tag (manual workflow_dispatch runs only)
        required: false
        type: string
        default: ''
      readme_path:
        description: Path to readme.txt (stable tag and changelog are verified against the version)
        required: false
        type: string
        default: src/wordpress-plugin/readme.txt
      shipped_paths:
        description: Space-separated paths; a change under them landing on the default branch after the PR's head commit refuses the tag (same meaning as prepare-release's input)
        required: false
        type: string
        default: src/
    secrets:
      RELEASE_BOT_PRIVATE_KEY:
        description: Private key of the release GitHub App (not needed for dry_run)
        required: false
    outputs:
      result:
        description: skipped | dry-run | tagged
        value: ${{ jobs.cut.outputs.result }}
      tag:
        description: Tag name (vX.Y.Z) when one was or would be created
        value: ${{ jobs.cut.outputs.tag }}

permissions:
  contents: read

jobs:
  cut:
    name: Tag merged release
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      checks: read
    outputs:
      result: ${{ steps.finish.outputs.result }}
      tag: ${{ steps.trigger.outputs.tag }}
    steps:
      - name: Disable git hooks
        run: git config --global core.hooksPath /dev/null

      # Everything here comes from the event payload; it reaches the script through env only.
      - name: Validate trigger
        id: trigger
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          MERGED: ${{ github.event.pull_request.merged }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_EVENT: ${{ github.event.pull_request.number }}
          PR_INPUT: ${{ inputs.pr_number }}
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DRY_RUN: ${{ inputs.dry_run }}
          CLIENT_ID: ${{ inputs.client_id }}
          APP_KEY: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            # Manual recovery path: read the PR from the API instead of the event payload.
            [[ "$PR_INPUT" =~ ^[0-9]+$ ]] || { echo "::error::pr_number must be a pull request number, got '$PR_INPUT'"; exit 1; }
            [ "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH" ] || { echo "::error::Run this from $DEFAULT_BRANCH, not $GITHUB_REF_NAME"; exit 1; }
            PR_NUMBER="$PR_INPUT"
            PR_JSON=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")
            MERGED=$(jq -r '.merged' <<<"$PR_JSON")
            HEAD_REPO=$(jq -r '.head.repo.full_name // ""' <<<"$PR_JSON")
            HEAD_REF=$(jq -r '.head.ref' <<<"$PR_JSON")
            HEAD_SHA=$(jq -r '.head.sha // ""' <<<"$PR_JSON")
            BASE_REF=$(jq -r '.base.ref' <<<"$PR_JSON")
            MERGE_SHA=$(jq -r '.merge_commit_sha // ""' <<<"$PR_JSON")
          else
            [ "$EVENT_NAME" = "pull_request" ] && [ "$ACTION" = "closed" ] || { echo "::error::Expected a pull_request closed or workflow_dispatch event, got $EVENT_NAME/$ACTION"; exit 1; }
            PR_NUMBER="$PR_EVENT"
            HEAD_SHA="$EVENT_HEAD_SHA"
          fi
          [ "$MERGED" = "true" ] || { echo "::error::The pull request was closed without merging"; exit 1; }
          [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ] || { echo "::error::Release PRs must come from this repository, not $HEAD_REPO"; exit 1; }
          [ "$BASE_REF" = "$DEFAULT_BRANCH" ] || { echo "::error::Base branch is $BASE_REF, expected $DEFAULT_BRANCH"; exit 1; }
          [[ "$HEAD_REF" =~ ^release/[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Head branch '$HEAD_REF' is not release/x.y.z"; exit 1; }
          [[ "$MERGE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::No merge commit SHA on the event"; exit 1; }
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::No PR head commit SHA on the event"; exit 1; }

          if [ "$DRY_RUN" != "true" ] && { [ -z "$CLIENT_ID" ] || [ -z "$APP_KEY" ]; }; then
            echo "::error::client_id and RELEASE_BOT_PRIVATE_KEY are required unless dry_run is true"
            exit 1
          fi

          VERSION="${HEAD_REF#release/}"
          {
            echo "version=$VERSION"
            echo "tag=v$VERSION"
            echo "sha=$MERGE_SHA"
            echo "head_sha=$HEAD_SHA"
            echo "pr=$PR_NUMBER"
          } >> "$GITHUB_OUTPUT"

      - name: Mint release app token
        id: app
        if: ${{ !inputs.dry_run }}
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ inputs.client_id }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout merge commit
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.trigger.outputs.sha }}
          # Full history: the staleness check diffs the PR's head commit against this one, and
          # a shallow clone would make that comparison fail (or silently lie) instead of running it.
          fetch-depth: 0
          persist-credentials: false

      - name: Verify CI on the PR head commit
        id: ci_gate
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.trigger.outputs.head_sha }}
        run: |
          set -euo pipefail
          # This job is itself triggered by `pull_request`, so GitHub lists its OWN run as a
          # check-run on this exact head commit, perpetually "in_progress" while we're inside it.
          # Left in, the gate would refuse every normal merge, forever. Filter it out by run ID.
          RUNS=$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/check-runs?per_page=100" \
            --jq "[.check_runs[] | select(.html_url | contains(\"/runs/$GITHUB_RUN_ID/\") | not)]")
          COUNT=$(jq 'length' <<<"$RUNS")
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::No check runs found on the PR head commit ($HEAD_SHA); refusing to tag"
            exit 1
          fi
          if ! jq -e 'all(.status == "completed" and (.conclusion | IN("success", "skipped", "neutral")))' <<<"$RUNS" >/dev/null; then
            echo "::error::CI is not green on the PR head commit ($HEAD_SHA); refusing to tag. This is the backstop for the branch ruleset's admin bypass — a release PR must still pass CI to be released."
            jq -r '.[] | "  \(.name): \(.status)/\(.conclusion // "-")"' <<<"$RUNS"
            exit 1
          fi
          echo "CI green on $HEAD_SHA ($COUNT check runs)."

      - name: Verify the release commit
        id: verify
        env:
          VERSION: ${{ steps.trigger.outputs.version }}
          TAG: ${{ steps.trigger.outputs.tag }}
          SHA: ${{ steps.trigger.outputs.sha }}
          HEAD_SHA: ${{ steps.trigger.outputs.head_sha }}
          README: ${{ inputs.readme_path }}
          SHIPPED: ${{ inputs.shipped_paths }}
        run: |
          set -euo pipefail

          skip() {
            echo "skip=true" >> "$GITHUB_OUTPUT"
            {
              echo "## Cut release: skipped"
              echo
              echo "$1"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::Skipped: $1"
            exit 0
          }

          # Failing here is the point: a release PR whose files disagree must never be tagged.
          COMP_V=$(node -p "require('./composer.json').version")
          STABLE_V=$(grep -m1 '^Stable tag:' "$README" | awk '{print $3}' | tr -d '\r')
          TOP_V=$(awk '/^== Changelog ==/{f=1;next} f && /^= [0-9]+\.[0-9]+\.[0-9]+ =$/{gsub(/[= ]/,"");print;exit}' "$README")
          for pair in "composer.json:$COMP_V" "readme.txt Stable tag:$STABLE_V" "readme.txt top changelog entry:$TOP_V"; do
            [ "${pair##*:}" = "$VERSION" ] || { echo "::error::${pair%%:*} is '${pair##*:}', expected $VERSION; refusing to tag"; exit 1; }
          done

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            skip "Tag $TAG already exists; nothing to do."
          fi

          HIGHEST=$(git ls-remote --tags --refs origin 'refs/tags/v[0-9]*' | sed 's#.*refs/tags/v##' | sort -V | tail -1)
          if [ -n "$HIGHEST" ] && [ "$(printf '%s\n%s\n' "$HIGHEST" "$VERSION" | sort -V | tail -1)" != "$VERSION" ]; then
            echo "::error::$VERSION is not higher than the latest tag v$HIGHEST; refusing to tag"
            exit 1
          fi

          # A squash/merge/rebase can land something else under $SHIPPED between the PR's head
          # commit and its merge commit (another PR merged first, or a direct push): the tag
          # would then ship changes the release PR's changelog never saw. git needs both commits
          # locally to tell; fetch-depth 0 on checkout normally guarantees that, but a squash
          # merge can leave the head commit unreachable once GitHub garbage-collects it, so fall
          # back to fetching it directly and warn (never silently skip the check) if that fails.
          if ! git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$HEAD_SHA" 2>/dev/null || true
          fi
          if git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null; then
            # shellcheck disable=SC2086 # SHIPPED is a deliberately unquoted space-separated path list
            if ! git diff --quiet "$HEAD_SHA" "$SHA" -- $SHIPPED; then
              echo "::error::Changes under '$SHIPPED' landed on the default branch between the release PR's head commit ($HEAD_SHA) and its merge commit ($SHA). The tag would ship changes the changelog never saw. Re-run prepare-release to fold them into a new release PR, then merge that one instead."
              git diff --stat "$HEAD_SHA" "$SHA" -- $SHIPPED
              exit 1
            fi
          else
            echo "::warning::Could not fetch the PR head commit ($HEAD_SHA) to check for changes merged after it; proceeding without that check."
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "Release commit for $VERSION verified (latest tag: v${HIGHEST:-none})."

      - name: Report (dry run)
        if: steps.verify.outputs.skip == 'false' && inputs.dry_run
        env:
          TAG: ${{ steps.trigger.outputs.tag }}
          SHA: ${{ steps.trigger.outputs.sha }}
        run: |
          {
            echo "## Cut release: dry run"
            echo
            echo "Verified. Would create tag \`$TAG\` at \`$SHA\` and start the release workflow. Nothing was created."
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Create tag
        id: tag
        if: steps.verify.outputs.skip == 'false' && !inputs.dry_run
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          TAG: ${{ steps.trigger.outputs.tag }}
          SHA: ${{ steps.trigger.outputs.sha }}
          PR_NUMBER: ${{ steps.trigger.outputs.pr }}
        run: |
          set -euo pipefail
          # Lightweight tag, like `arts-wp release` makes. Created by the App, so its push
          # event starts the tag-triggered release workflow.
          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$SHA" --jq '.ref'
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "Tagged \`$TAG\` at \`${SHA:0:7}\`. The release workflow should be starting: https://github.com/$GITHUB_REPOSITORY/actions/workflows/release.yml"
          {
            echo "## Cut release: tagged"
            echo
            echo "Created \`$TAG\` at \`$SHA\`."
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Finish
        id: finish
        if: always()
        env:
          SKIP: ${{ steps.verify.outputs.skip }}
          DRY_RUN: ${{ inputs.dry_run }}
          TAG_OUTCOME: ${{ steps.tag.outcome }}
        run: |
          if [ "$SKIP" != "false" ]; then RESULT=skipped
          elif [ "$DRY_RUN" = "true" ]; then RESULT=dry-run
          elif [ "$TAG_OUTCOME" = "success" ]; then RESULT=tagged
          else RESULT=skipped
          fi
          echo "result=$RESULT" >> "$GITHUB_OUTPUT"
