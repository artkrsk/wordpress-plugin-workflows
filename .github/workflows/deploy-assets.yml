name: Deploy listing to WordPress.org

# The listing is the plugin page: assets (banners, icons, screenshots, the
# Playground blueprint) in SVN assets/, and the text, which wp.org reads from
# the readme.txt of the stable tag. Neither needs a new plugin version, and
# release.yml only fires on a v* tag, which would otherwise force a fake
# version bump to publish a new screenshot or a readme edit.
#
# Touches assets/, trunk/readme.txt and tags/<stable>/readme.txt ONLY. The rest
# of trunk/ and tags/ stays at depth-empty in the working copy. The readme is
# refused when it describes another version than the live one (a raised Stable
# tag, an undated changelog entry): that text ships with its release.
# release.yml keeps syncing the same files on real releases, so the paths agree.

on:
  workflow_call:
    inputs:
      plugin_slug:
        description: The frozen wp.org slug
        required: true
        type: string
      dry_run:
        description: Print the changes without committing
        required: false
        type: boolean
        default: false
      blueprint_check:
        description: Assert the generated blueprint is current before shipping it
        required: false
        type: boolean
        default: false
      blueprint_check_command:
        description: Command for the blueprint check (see test.yml's input of the same name)
        required: false
        type: string
        default: pnpm exec arts-wp blueprint check
      readme:
        description: Also deploy the readme to trunk and the stable tag
        required: false
        type: boolean
        default: true
      readme_path:
        description: The readme.txt that ships in the plugin ZIP
        required: false
        type: string
        default: src/wordpress-plugin/readme.txt
    secrets:
      SVN_USERNAME:
        required: true
      SVN_PASSWORD:
        required: true

permissions:
  contents: read

jobs:
  deploy-assets:
    name: Sync the listing to SVN
    runs-on: ubuntu-latest
    environment:
      name: wordpress-org
      url: https://wordpress.org/plugins/${{ inputs.plugin_slug }}/
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Setup pnpm
        run: corepack enable

      - name: Install Node dependencies
        if: inputs.blueprint_check
        run: pnpm install --frozen-lockfile

      # The blueprint is generated, so a hand-edit or a forgotten rebuild would
      # otherwise ship silently.
      - name: Blueprint is valid and regenerated
        if: inputs.blueprint_check
        run: ${{ inputs.blueprint_check_command }}

      - name: Setup SVN
        run: which svn || (sudo apt-get update && sudo apt-get install -y subversion)

      - name: Checkout SVN (assets only)
        run: |
          # --depth immediates gets the bare trunk/tags/assets entries without
          # their contents, then only assets is filled in. Avoids pulling every
          # tagged release.
          svn checkout --non-interactive --trust-server-cert --depth immediates \
            --username="${{ secrets.SVN_USERNAME }}" \
            --password="${{ secrets.SVN_PASSWORD }}" \
            "https://plugins.svn.wordpress.org/${{ inputs.plugin_slug }}/" /tmp/svn

          svn update --non-interactive --trust-server-cert --set-depth infinity \
            --username="${{ secrets.SVN_USERNAME }}" \
            --password="${{ secrets.SVN_PASSWORD }}" \
            /tmp/svn/assets

      - name: Mirror .wordpress-org into assets
        run: |
          # --delete so a file dropped from the repo also leaves the listing.
          # Dotfiles are never copied (.DS_Store); svn 1.7+ keeps its only .svn
          # at the working-copy root, so assets/ holds no metadata to clobber.
          rsync -a --delete --exclude='.*' .wordpress-org/ /tmp/svn/assets/

      # wp.org reads the Stable tag from trunk/readme.txt and then shows the page
      # from tags/<stable>/readme.txt, so both get the same file.
      - name: Readme into trunk and the stable tag
        if: inputs.readme
        env:
          README: ${{ inputs.readme_path }}
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
        run: |
          set -euo pipefail

          svn_up() {
            svn update --non-interactive --trust-server-cert \
              --username="$SVN_USERNAME" --password="$SVN_PASSWORD" "$@"
          }
          stable_tag() { grep -m1 '^Stable tag:' "$1" | awk '{print $3}' | tr -d '\r'; }

          SRC="$GITHUB_WORKSPACE/$README"
          if [ ! -f "$SRC" ]; then
            echo "::error::$README not found"
            exit 1
          fi
          VERSION=$(stable_tag "$SRC")
          if [ -z "$VERSION" ]; then
            echo "::error::$README has no Stable tag"
            exit 1
          fi

          cd /tmp/svn
          svn_up -q trunk/readme.txt
          if [ ! -f trunk/readme.txt ]; then
            echo "::error::trunk/readme.txt is missing on WordPress.org"
            exit 1
          fi
          LIVE=$(stable_tag trunk/readme.txt)
          if [ "$VERSION" != "$LIVE" ]; then
            echo "::error::$README has Stable tag $VERSION but WordPress.org is on $LIVE. That readme ships with its release."
            exit 1
          fi

          svn_up -q --set-depth empty "tags/$VERSION"
          svn_up -q "tags/$VERSION/readme.txt"
          if [ ! -f "tags/$VERSION/readme.txt" ]; then
            echo "::error::tags/$VERSION/readme.txt is missing on WordPress.org"
            exit 1
          fi

          # The newest changelog entry must be the live version, dated by the
          # release; an undated one is still waiting for its release.
          TOP=$(awk '/^== Changelog ==/{f=1;next} f && /^== /{exit} f && /^= /{print;exit}' "$SRC" | tr -d '\r')
          if [[ "$TOP" != "= $VERSION – "*" =" ]]; then
            echo "::error::The newest changelog entry in $README is '$TOP', not the dated $VERSION entry. That readme ships with its release."
            exit 1
          fi

          cp "$SRC" trunk/readme.txt
          cp "$SRC" "tags/$VERSION/readme.txt"
          echo "README_TARGETS=trunk/readme.txt tags/$VERSION/readme.txt" >> "$GITHUB_ENV"

      - name: Stage and show the diff
        run: |
          cd /tmp/svn
          svn add --force assets --auto-props --parents --depth infinity -q 2>/dev/null || true
          svn status assets | grep '^!' | sed 's/! *//' | xargs -r -I% svn rm %@ 2>/dev/null || true

          echo "── pending changes ─────────────────────────────"
          # shellcheck disable=SC2086 # README_TARGETS is a space-separated path list
          svn status assets ${README_TARGETS:-}
          if [ -n "${README_TARGETS:-}" ]; then
            # shellcheck disable=SC2086
            svn diff ${README_TARGETS}
          fi
          echo "────────────────────────────────────────────────"

      - name: Commit to WordPress.org
        if: ${{ !inputs.dry_run }}
        run: |
          cd /tmp/svn

          # shellcheck disable=SC2086 # README_TARGETS is a space-separated path list
          if [ -z "$(svn status assets ${README_TARGETS:-})" ]; then
            echo "Nothing to deploy — the listing already matches."
            exit 0
          fi

          # shellcheck disable=SC2086
          svn commit assets ${README_TARGETS:-} --non-interactive --trust-server-cert \
            --username="${{ secrets.SVN_USERNAME }}" \
            --password="${{ secrets.SVN_PASSWORD }}" \
            -m "Update listing (${GITHUB_SHA:0:7})"

          echo "Deployed. The listing and ps.w.org CDN may lag a few minutes."

      - name: Dry run summary
        if: inputs.dry_run
        run: echo "Dry run — nothing was committed."
